name: Reality Gate CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  reality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --no-audit solc@0.8.20

      - name: Check production dependency advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run Cryptographic Interoperability Audit
        run: |
          python scripts/verify_crypto_interop.py

      - name: Run Fail-Closed Reality Gate Verification
        run: |
          python scripts/check.py
