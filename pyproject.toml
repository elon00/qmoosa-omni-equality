[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmoosa-omni-equality"
version = "1.0.0"
description = "Autonomous Web 4.0 Post-Quantum Egalitarian Protocol for Resource Allocation and Legal Parity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "qiskit>=2.0.0",
    "qiskit-aer>=0.14.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
